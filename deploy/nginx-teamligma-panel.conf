# Team Ligma Development Panel - nginx site (port 26767)
server {
    listen 26767;
    # listen [::]:26767;   # enable on IPv6-capable hosts
    server_name _;

    root /roc/claude/panel/wwwroot;
    index index.html;

    # Uno WebAssembly payloads
    types {
        application/wasm wasm;
        application/javascript js mjs;
        application/json json;
        application/octet-stream dat dll pdb blat;
        font/ttf ttf;
    }
    include /etc/nginx/mime.types;
    gzip_static on;
    client_max_body_size 512m;

    # Optional extra layer in front of the panel's own accounts.
    # auth_basic "Team Ligma Development Panel";
    # auth_basic_user_file /etc/nginx/teamligma.htpasswd;

    location /api/ {
        proxy_pass http://127.0.0.1:5267;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /_framework/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
